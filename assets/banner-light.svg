<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="0"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="1100" cy="300" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="950" cy="80" r="40" fill="#f093fb" opacity="0.2"/>
  
  <!-- AI text crossed out -->
  <text x="120" y="180" font-family="Arial Black, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.9">AI</text>
  <line x1="100" y1="130" x2="280" y2="230" stroke="#ff6b6b" stroke-width="8" opacity="0.9"/>
  <line x1="100" y1="230" x2="280" y2="130" stroke="#ff6b6b" stroke-width="8" opacity="0.9"/>
  
  <!-- Arrow -->
  <text x="320" y="190" font-family="Arial" font-size="70" fill="#f093fb" opacity="0.9">→</text>
  
  <!-- Human text -->
  <text x="430" y="190" font-family="Arial Black, sans-serif" font-size="80" font-weight="bold" fill="url(#titleGrad)">HUMAN</text>
  
  <!-- Title -->
  <text x="120" y="280" font-family="Arial" font-size="60" font-weight="bold" fill="#ffffff" opacity="0.95">AIGC-Shed</text>
  
  <!-- Subtitle -->
  <text x="120" y="330" font-family="Arial" font-size="24" fill="#e0e0e0" opacity="0.85">🦞 Dragon Shrimp Deshelling · 80% → 15% · Not Paraphrasing</text>
  
  <!-- Shield icon -->
  <rect x="900" y="120" width="180" height="180" rx="20" fill="#ffffff" opacity="0.1"/>
  <text x="920" y="220" font-family="Arial" font-size="80" fill="#f093fb" opacity="0.8">🛡️</text>
  <text x="930" y="290" font-family="Arial" font-size="20" fill="#ffffff" opacity="0.7">BYPASSED</text>
</svg>
